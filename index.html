<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Nailong's Video Corner</title>
<style>
* { box-sizing: border-box; }
html, body { margin:0; padding:0; width:100%; background:transparent; font-family:Arial,sans-serif; }
.video-card { max-width:1000px; margin:0 auto; padding:16px; background:#FFF4B8; border:5px solid #F5C84B; border-radius:24px; box-shadow:0 5px 15px #D8B95755; }
.heading { text-align:center; color:#A77B28; font-weight:bold; padding-bottom:14px; font-size:17px; }
.video-wrap { position:relative; width:100%; aspect-ratio:16/9; border:5px solid #fff; border-radius:16px; overflow:hidden; background:#fff; }
.video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
.footer { text-align:center; padding-top:14px; color:#A77B28; font-weight:bold; font-size:14px; }
@media(max-width:600px) { .video-card { padding:10px; border-width:3px; border-radius:16px; } .heading { font-size:15px; padding-bottom:10px; } .video-wrap { border-width:3px; border-radius:10px; } .footer { font-size:12px; padding-top:10px; } }
</style>
</head>
<body>
<main class="video-card">
  <div class="heading">✨ Nailong's Video Corner ✨</div>
  <div class="video-wrap">
    <iframe src="https://www.youtube.com/embed/FvxAcZIDCtk?playsinline=1&amp;rel=0" title="Video Pembelajaran" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  </div>
  <div class="footer">🌼 Selamat Menonton! 🌼</div>
</main>
</body>
</html>
